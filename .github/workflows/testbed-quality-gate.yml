name: Testbed Quality Gate

permissions:
  contents: read

concurrency:
  group: testbed-quality-gate
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - ft-upfront
          - sync-constraint
          - mntd
          - tps
          - nightly
          - heartbeat
      image:
        description: "f1r3node image (e.g. amamata/rust-node:0.4.15)"
        required: true
        type: string
      testbed_ref:
        description: "Testbed branch, tag or commit"
        required: true
        default: dev
        type: string
      testbed_repo:
        description: "Testbed owner/repository (defaults to the TESTBED_REPOSITORY secret)"
        required: false
        type: string
      strict:
        description: "Fail the job if any experiment check fails"
        required: true
        default: true
        type: boolean
      mntd_cap:
        description: "TPS only: override the hardcoded BestMNTD cap (0 = use built-in constant). Set from the MNTD run output."
        required: false
        default: "0"
        type: string

jobs:

  # ─────────────────────────── candidate image ────────────────────────────────
  pin-image:
    name: pin candidate image digest
    runs-on: [self-hosted, linux, x64, testbed]
    timeout-minutes: 30
    outputs:
      node_image: ${{ steps.pin.outputs.node_image }}
    steps:
      - name: Verify testbed checkout configuration
        env:
          SOURCE_REPO: ${{ inputs.testbed_repo || secrets.TESTBED_REPOSITORY }}
        run: test -n "$SOURCE_REPO" || { echo "::error::Set TESTBED_REPOSITORY or supply testbed_repo"; exit 1; }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.testbed_repo || secrets.TESTBED_REPOSITORY }}
          ref: ${{ inputs.testbed_ref }}
          persist-credentials: false
          token: ${{ secrets.TESTBED_PAT }}
          path: testbed

      - name: Pin f1r3node image digest
        id: pin
        env:
          CANDIDATE_IMAGE: ${{ inputs.image }}
        run: |
          ref=$(./testbed/deploy/pin-image.sh "$CANDIDATE_IMAGE")
          echo "node_image=${ref#NODE_IMAGE=}" >> "$GITHUB_OUTPUT"
          echo "Candidate image: ${ref#NODE_IMAGE=}" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────── smoke ──────────────────────────────────────────
  smoke:
    name: smoke (~30 min)
    needs: pin-image
    if: contains(fromJSON('["smoke","nightly"]'), inputs.suite)
    runs-on: [self-hosted, linux, x64, testbed]
    timeout-minutes: 80
    env:
      JOB_NAME: testbed-qg-${{ github.run_id }}-${{ github.run_attempt }}-smoke
      JOB_ACTIVE_DEADLINE: "4800"
      NODE_IMAGE: ${{ needs.pin-image.outputs.node_image }}
      LOG_HOST_PATH: /tmp/asi-chain-logs/${{ github.run_id }}-${{ github.run_attempt }}/smoke
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.testbed_repo || secrets.TESTBED_REPOSITORY }}
          ref: ${{ inputs.testbed_ref }}
          persist-credentials: false
          token: ${{ secrets.TESTBED_PAT }}
          path: testbed

      - name: Build testbed
        working-directory: testbed
        run: make build

      - name: Clean up earlier cancelled runs
        working-directory: testbed
        run: |
          ./testbed clean --orphaned-run-prefix testbed-qg- ||
            echo "::warning::cleanup of earlier quality-gate runs failed; see the log of this step"

      - name: Import testbed image into k3s
        working-directory: testbed
        run: make docker

      - name: Generate validator keys
        working-directory: testbed
        run: ./testbed gen --validators 20 --out .env

      - name: Apply RBAC
        working-directory: testbed
        run: make job-setup

      - name: Run suite
        id: launch
        working-directory: testbed
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          make job-run JOB_UID_OUTPUT="$GITHUB_OUTPUT" ENV=.env SUITE=smoke JOB_NAME="$JOB_NAME" \
            NODE_IMAGE="$NODE_IMAGE" NODE_IMAGE_PULL_POLICY=IfNotPresent \
            PROFILE=ci STRICT="$STRICT" OUTPUT_FORMAT=json \
            JOB_ACTIVE_DEADLINE="$JOB_ACTIVE_DEADLINE" \
            LOG_HOST_PATH="$LOG_HOST_PATH"

      - name: Wait for job
        working-directory: testbed
        run: make job-wait JOB="$JOB_NAME"

      - name: Cleanup
        if: always() && steps.launch.outputs.job_uid != ''
        working-directory: testbed
        env:
          JOB_UID: ${{ steps.launch.outputs.job_uid }}
        run: ./testbed clean --run-id "$JOB_NAME" --delete-job-uid "$JOB_UID"

      - name: Summarize results
        if: always()
        working-directory: testbed
        run: |
          make job-summarize LOG_HOST_PATH="$LOG_HOST_PATH" >> "$GITHUB_STEP_SUMMARY" || \
            echo "No results.json found — see uploaded logs." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testbed-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LOG_HOST_PATH }}
          retention-days: 14

  # ─────────────────────────── ft-upfront phase 1 (ft 0.1 / 0.33 / 0.5) ───────
  ft-upfront-p1:
    name: ft-upfront phase 1 — ft0.1/0.33/0.5 (deadline 4 h 5 min, 66 pods)
    needs: pin-image
    if: contains(fromJSON('["ft-upfront","nightly"]'), inputs.suite)
    runs-on: [self-hosted, linux, x64, testbed]
    timeout-minutes: 270
    env:
      JOB_NAME: testbed-qg-${{ github.run_id }}-${{ github.run_attempt }}-ft-upfront-p1
      JOB_ACTIVE_DEADLINE: "16200"
      NODE_IMAGE: ${{ needs.pin-image.outputs.node_image }}
      LOG_HOST_PATH: /tmp/asi-chain-logs/${{ github.run_id }}-${{ github.run_attempt }}/ft-upfront-p1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.testbed_repo || secrets.TESTBED_REPOSITORY }}
          ref: ${{ inputs.testbed_ref }}
          persist-credentials: false
          token: ${{ secrets.TESTBED_PAT }}
          path: testbed

      - name: Build testbed
        working-directory: testbed
        run: make build

      - name: Clean up earlier cancelled runs
        working-directory: testbed
        run: |
          ./testbed clean --orphaned-run-prefix testbed-qg- ||
            echo "::warning::cleanup of earlier quality-gate runs failed; see the log of this step"

      - name: Import testbed image into k3s
        working-directory: testbed
        run: make docker

      - name: Generate validator keys
        working-directory: testbed
        run: ./testbed gen --validators 20 --out .env

      - name: Apply RBAC
        working-directory: testbed
        run: make job-setup

      - name: Run suite
        id: launch
        working-directory: testbed
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          make job-run JOB_UID_OUTPUT="$GITHUB_OUTPUT" ENV=.env SUITE=ft-upfront-p1 JOB_NAME="$JOB_NAME" \
            NODE_IMAGE="$NODE_IMAGE" NODE_IMAGE_PULL_POLICY=IfNotPresent \
            PROFILE=ci STRICT="$STRICT" OUTPUT_FORMAT=json \
            JOB_ACTIVE_DEADLINE="$JOB_ACTIVE_DEADLINE" \
            LOG_HOST_PATH="$LOG_HOST_PATH"

      - name: Wait for job
        working-directory: testbed
        run: make job-wait JOB="$JOB_NAME"

      - name: Cleanup
        if: always() && steps.launch.outputs.job_uid != ''
        working-directory: testbed
        env:
          JOB_UID: ${{ steps.launch.outputs.job_uid }}
        run: ./testbed clean --run-id "$JOB_NAME" --delete-job-uid "$JOB_UID"

      - name: Summarize results
        if: always()
        working-directory: testbed
        run: |
          make job-summarize LOG_HOST_PATH="$LOG_HOST_PATH" >> "$GITHUB_STEP_SUMMARY" || \
            echo "No results.json found — see uploaded logs." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testbed-ft-upfront-p1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LOG_HOST_PATH }}
          retention-days: 14

  # ─────────────────────────── ft-upfront phase 2 (ft 0.67 / 0.99) ────────────
  ft-upfront-p2:
    name: ft-upfront phase 2 — ft0.67/0.99 (deadline 3 h 40 min, 44 pods)
    needs: [pin-image, ft-upfront-p1]
    if: contains(fromJSON('["ft-upfront","nightly"]'), inputs.suite)
    runs-on: [self-hosted, linux, x64, testbed]
    timeout-minutes: 245
    env:
      JOB_NAME: testbed-qg-${{ github.run_id }}-${{ github.run_attempt }}-ft-upfront-p2
      JOB_ACTIVE_DEADLINE: "14700"
      NODE_IMAGE: ${{ needs.pin-image.outputs.node_image }}
      LOG_HOST_PATH: /tmp/asi-chain-logs/${{ github.run_id }}-${{ github.run_attempt }}/ft-upfront-p2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.testbed_repo || secrets.TESTBED_REPOSITORY }}
          ref: ${{ inputs.testbed_ref }}
          persist-credentials: false
          token: ${{ secrets.TESTBED_PAT }}
          path: testbed

      - name: Build testbed
        working-directory: testbed
        run: make build

      - name: Clean up earlier cancelled runs
        working-directory: testbed
        run: |
          ./testbed clean --orphaned-run-prefix testbed-qg- ||
            echo "::warning::cleanup of earlier quality-gate runs failed; see the log of this step"

      - name: Import testbed image into k3s
        working-directory: testbed
        run: make docker

      - name: Generate validator keys
        working-directory: testbed
        run: ./testbed gen --validators 20 --out .env

      - name: Apply RBAC
        working-directory: testbed
        run: make job-setup

      - name: Run suite
        id: launch
        working-directory: testbed
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          make job-run JOB_UID_OUTPUT="$GITHUB_OUTPUT" ENV=.env SUITE=ft-upfront-p2 JOB_NAME="$JOB_NAME" \
            NODE_IMAGE="$NODE_IMAGE" NODE_IMAGE_PULL_POLICY=IfNotPresent \
            PROFILE=ci STRICT="$STRICT" OUTPUT_FORMAT=json \
            JOB_ACTIVE_DEADLINE="$JOB_ACTIVE_DEADLINE" \
            LOG_HOST_PATH="$LOG_HOST_PATH"

      - name: Wait for job
        working-directory: testbed
        run: make job-wait JOB="$JOB_NAME"

      - name: Cleanup
        if: always() && steps.launch.outputs.job_uid != ''
        working-directory: testbed
        env:
          JOB_UID: ${{ steps.launch.outputs.job_uid }}
        run: ./testbed clean --run-id "$JOB_NAME" --delete-job-uid "$JOB_UID"

      - name: Summarize results
        if: always()
        working-directory: testbed
        run: |
          make job-summarize LOG_HOST_PATH="$LOG_HOST_PATH" >> "$GITHUB_STEP_SUMMARY" || \
            echo "No results.json found — see uploaded logs." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testbed-ft-upfront-p2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LOG_HOST_PATH }}
          retention-days: 14

  # ─────────────────────────── sync-constraint ────────────────────────────────
  sync-constraint:
    name: sync-constraint (deadline 5 h 55 min)
    needs: pin-image
    if: contains(fromJSON('["sync-constraint","nightly"]'), inputs.suite)
    runs-on: [self-hosted, linux, x64, testbed]
    timeout-minutes: 380
    env:
      JOB_NAME: testbed-qg-${{ github.run_id }}-${{ github.run_attempt }}-sync-constraint
      JOB_ACTIVE_DEADLINE: "22800"
      NODE_IMAGE: ${{ needs.pin-image.outputs.node_image }}
      LOG_HOST_PATH: /tmp/asi-chain-logs/${{ github.run_id }}-${{ github.run_attempt }}/sync-constraint
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.testbed_repo || secrets.TESTBED_REPOSITORY }}
          ref: ${{ inputs.testbed_ref }}
          persist-credentials: false
          token: ${{ secrets.TESTBED_PAT }}
          path: testbed

      - name: Build testbed
        working-directory: testbed
        run: make build

      - name: Clean up earlier cancelled runs
        working-directory: testbed
        run: |
          ./testbed clean --orphaned-run-prefix testbed-qg- ||
            echo "::warning::cleanup of earlier quality-gate runs failed; see the log of this step"

      - name: Import testbed image into k3s
        working-directory: testbed
        run: make docker

      - name: Generate validator keys
        working-directory: testbed
        run: ./testbed gen --validators 20 --out .env

      - name: Apply RBAC
        working-directory: testbed
        run: make job-setup

      - name: Run suite
        id: launch
        working-directory: testbed
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          make job-run JOB_UID_OUTPUT="$GITHUB_OUTPUT" ENV=.env SUITE=sync-constraint JOB_NAME="$JOB_NAME" \
            NODE_IMAGE="$NODE_IMAGE" NODE_IMAGE_PULL_POLICY=IfNotPresent \
            PROFILE=ci STRICT="$STRICT" OUTPUT_FORMAT=json \
            JOB_ACTIVE_DEADLINE="$JOB_ACTIVE_DEADLINE" \
            LOG_HOST_PATH="$LOG_HOST_PATH"

      - name: Wait for job
        working-directory: testbed
        env:
          WAIT_TIMEOUT: 380m
        run: make job-wait JOB="$JOB_NAME"

      - name: Cleanup
        if: always() && steps.launch.outputs.job_uid != ''
        working-directory: testbed
        env:
          JOB_UID: ${{ steps.launch.outputs.job_uid }}
        run: ./testbed clean --run-id "$JOB_NAME" --delete-job-uid "$JOB_UID"

      - name: Summarize results
        if: always()
        working-directory: testbed
        run: |
          make job-summarize LOG_HOST_PATH="$LOG_HOST_PATH" >> "$GITHUB_STEP_SUMMARY" || \
            echo "No results.json found — see uploaded logs." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testbed-sync-constraint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LOG_HOST_PATH }}
          retention-days: 14

  # ─────────────────────────── mntd ───────────────────────────────────────────
  mntd:
    name: mntd calibration (~3 h)
    needs: pin-image
    if: inputs.suite == 'mntd'
    runs-on: [self-hosted, linux, x64, testbed]
    timeout-minutes: 240
    env:
      JOB_NAME: testbed-qg-${{ github.run_id }}-${{ github.run_attempt }}-mntd
      JOB_ACTIVE_DEADLINE: "14400"
      NODE_IMAGE: ${{ needs.pin-image.outputs.node_image }}
      LOG_HOST_PATH: /tmp/asi-chain-logs/${{ github.run_id }}-${{ github.run_attempt }}/mntd
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.testbed_repo || secrets.TESTBED_REPOSITORY }}
          ref: ${{ inputs.testbed_ref }}
          persist-credentials: false
          token: ${{ secrets.TESTBED_PAT }}
          path: testbed

      - name: Build testbed
        working-directory: testbed
        run: make build

      - name: Clean up earlier cancelled runs
        working-directory: testbed
        run: |
          ./testbed clean --orphaned-run-prefix testbed-qg- ||
            echo "::warning::cleanup of earlier quality-gate runs failed; see the log of this step"

      - name: Import testbed image into k3s
        working-directory: testbed
        run: make docker

      - name: Generate validator keys
        working-directory: testbed
        run: ./testbed gen --validators 20 --out .env

      - name: Apply RBAC
        working-directory: testbed
        run: make job-setup

      - name: Run suite
        id: launch
        working-directory: testbed
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          make job-run JOB_UID_OUTPUT="$GITHUB_OUTPUT" ENV=.env SUITE=mntd JOB_NAME="$JOB_NAME" \
            NODE_IMAGE="$NODE_IMAGE" NODE_IMAGE_PULL_POLICY=IfNotPresent \
            PROFILE=ci STRICT="$STRICT" OUTPUT_FORMAT=json \
            JOB_ACTIVE_DEADLINE="$JOB_ACTIVE_DEADLINE" \
            LOG_HOST_PATH="$LOG_HOST_PATH"

      - name: Wait for job
        working-directory: testbed
        run: make job-wait JOB="$JOB_NAME"

      - name: Cleanup
        if: always() && steps.launch.outputs.job_uid != ''
        working-directory: testbed
        env:
          JOB_UID: ${{ steps.launch.outputs.job_uid }}
        run: ./testbed clean --run-id "$JOB_NAME" --delete-job-uid "$JOB_UID"

      - name: Summarize results
        if: always()
        working-directory: testbed
        run: |
          make job-summarize LOG_HOST_PATH="$LOG_HOST_PATH" >> "$GITHUB_STEP_SUMMARY" || \
            echo "No results.json found — see uploaded logs." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testbed-mntd-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LOG_HOST_PATH }}
          retention-days: 14

  # ─────────────────────────── tps ────────────────────────────────────────────
  tps:
    name: tps throughput (~4 h)
    needs: pin-image
    if: inputs.suite == 'tps'
    runs-on: [self-hosted, linux, x64, testbed]
    timeout-minutes: 300
    env:
      JOB_NAME: testbed-qg-${{ github.run_id }}-${{ github.run_attempt }}-tps
      JOB_ACTIVE_DEADLINE: "18000"
      NODE_IMAGE: ${{ needs.pin-image.outputs.node_image }}
      LOG_HOST_PATH: /tmp/asi-chain-logs/${{ github.run_id }}-${{ github.run_attempt }}/tps
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.testbed_repo || secrets.TESTBED_REPOSITORY }}
          ref: ${{ inputs.testbed_ref }}
          persist-credentials: false
          token: ${{ secrets.TESTBED_PAT }}
          path: testbed

      - name: Build testbed
        working-directory: testbed
        run: make build

      - name: Clean up earlier cancelled runs
        working-directory: testbed
        run: |
          ./testbed clean --orphaned-run-prefix testbed-qg- ||
            echo "::warning::cleanup of earlier quality-gate runs failed; see the log of this step"

      - name: Import testbed image into k3s
        working-directory: testbed
        run: make docker

      - name: Generate validator keys
        working-directory: testbed
        run: ./testbed gen --validators 20 --out .env

      - name: Apply RBAC
        working-directory: testbed
        run: make job-setup

      - name: Run suite
        id: launch
        working-directory: testbed
        env:
          STRICT: ${{ inputs.strict }}
          MNTD_CAP: ${{ inputs.mntd_cap }}
        run: |
          case "$MNTD_CAP" in
          '' | *[!0-9]*)
            echo "::error::mntd_cap must be a non-negative integer, got '$MNTD_CAP'"
            exit 1
            ;;
          esac
          make job-run JOB_UID_OUTPUT="$GITHUB_OUTPUT" ENV=.env SUITE=tps JOB_NAME="$JOB_NAME" \
            NODE_IMAGE="$NODE_IMAGE" NODE_IMAGE_PULL_POLICY=IfNotPresent \
            PROFILE=ci STRICT="$STRICT" OUTPUT_FORMAT=json \
            JOB_ACTIVE_DEADLINE="$JOB_ACTIVE_DEADLINE" \
            MNTD_CAP="$MNTD_CAP" \
            LOG_HOST_PATH="$LOG_HOST_PATH"

      - name: Wait for job
        working-directory: testbed
        run: make job-wait JOB="$JOB_NAME"

      - name: Cleanup
        if: always() && steps.launch.outputs.job_uid != ''
        working-directory: testbed
        env:
          JOB_UID: ${{ steps.launch.outputs.job_uid }}
        run: ./testbed clean --run-id "$JOB_NAME" --delete-job-uid "$JOB_UID"

      - name: Summarize results
        if: always()
        working-directory: testbed
        run: |
          make job-summarize LOG_HOST_PATH="$LOG_HOST_PATH" >> "$GITHUB_STEP_SUMMARY" || \
            echo "No results.json found — see uploaded logs." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testbed-tps-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LOG_HOST_PATH }}
          retention-days: 14

  # ─────────────────────────── heartbeat ──────────────────────────────────────
  heartbeat:
    name: heartbeat (90 min run limit)
    needs: pin-image
    if: inputs.suite == 'heartbeat'
    runs-on: [self-hosted, linux, x64, testbed]
    timeout-minutes: 180
    env:
      JOB_NAME: testbed-qg-${{ github.run_id }}-${{ github.run_attempt }}-heartbeat
      JOB_ACTIVE_DEADLINE: "10800"
      NODE_IMAGE: ${{ needs.pin-image.outputs.node_image }}
      LOG_HOST_PATH: /tmp/asi-chain-logs/${{ github.run_id }}-${{ github.run_attempt }}/heartbeat
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.testbed_repo || secrets.TESTBED_REPOSITORY }}
          ref: ${{ inputs.testbed_ref }}
          persist-credentials: false
          token: ${{ secrets.TESTBED_PAT }}
          path: testbed

      - name: Build testbed
        working-directory: testbed
        run: make build

      - name: Clean up earlier cancelled runs
        working-directory: testbed
        run: |
          ./testbed clean --orphaned-run-prefix testbed-qg- ||
            echo "::warning::cleanup of earlier quality-gate runs failed; see the log of this step"

      - name: Import testbed image into k3s
        working-directory: testbed
        run: make docker

      - name: Generate validator keys
        working-directory: testbed
        run: ./testbed gen --validators 20 --out .env

      - name: Apply RBAC
        working-directory: testbed
        run: make job-setup

      - name: Run suite
        id: launch
        working-directory: testbed
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          make job-run JOB_UID_OUTPUT="$GITHUB_OUTPUT" ENV=.env SUITE=heartbeat JOB_NAME="$JOB_NAME" \
            NODE_IMAGE="$NODE_IMAGE" NODE_IMAGE_PULL_POLICY=IfNotPresent \
            PROFILE=ci STRICT="$STRICT" OUTPUT_FORMAT=json \
            JOB_ACTIVE_DEADLINE="$JOB_ACTIVE_DEADLINE" \
            ONLY_BEST=1 DURATION=90m \
            LOG_HOST_PATH="$LOG_HOST_PATH"

      - name: Wait for job
        working-directory: testbed
        run: make job-wait JOB="$JOB_NAME"

      - name: Cleanup
        if: always() && steps.launch.outputs.job_uid != ''
        working-directory: testbed
        env:
          JOB_UID: ${{ steps.launch.outputs.job_uid }}
        run: ./testbed clean --run-id "$JOB_NAME" --delete-job-uid "$JOB_UID"

      - name: Summarize results
        if: always()
        working-directory: testbed
        run: |
          make job-summarize LOG_HOST_PATH="$LOG_HOST_PATH" >> "$GITHUB_STEP_SUMMARY" || \
            echo "No results.json found — see uploaded logs." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testbed-heartbeat-${{ github.run_id }}-${{ github.run_attempt }}
